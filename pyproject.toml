[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "malca"
version = "0.1a0"
description = "MALCA: Multi-timescale ASAS-SN Light Curve Analysis"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Calder Lenhart" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "numba",
    "tqdm",
    "matplotlib",
    "astropy",
    "celerite2",
    "pyarrow",
    "plotly",
    "watchdog",
    "dash>=2.14.0",
    "dash-bootstrap-components>=1.5.0",
    "astroquery>=0.4.6",
    "dustmaps3d",
    "pyvo",
    "banyan-sigma @ git+https://github.com/jgagneastro/banyan_sigma.git",
    "requests",
    "joblib",
    "lightgbm",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
]

[project.scripts]
malca = "malca.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["malca*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "malca"
version = "0.1a0"
description = "MALCA: Multi-timescale ASAS-SN Light Curve Analysis"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Calder Lenhart" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "numba",
    "tqdm",
    "matplotlib",
    "astropy",
    "celerite2",
    "pyarrow",
    "iar",
]

[project.optional-dependencies]
catalogs = [
    "astroquery>=0.4.6",
    "banyan-sigma @ git+https://github.com/jgagneastro/banyan_sigma.git",
    "dust_extinction",
    "dustmaps3d",
    "healpy",
    "lightkurve",
    "pyvo",
    "regions",
    "requests",
    "skypatrol",
    "sparclclient",
]
review = [
    "plotly",
    "kaleido",
    "watchdog",
    "dash[diskcache]>=2.14.0",
    "dash-bootstrap-components>=1.5.0",
]
ml = [
    "joblib",
    "lightgbm",
    "scikit-learn",
    "torch",
]
sed = [
    "pystellibs @ git+https://github.com/mfouesneau/pystellibs.git@v1.0.0",
]
phoebe = [
    "phoebe; python_version < '3.13'",
]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
]
notebooks = [
    "jupyterlab",
    "ipykernel",
    "seaborn",
]
all = [
    "astroquery>=0.4.6",
    "banyan-sigma @ git+https://github.com/jgagneastro/banyan_sigma.git",
    "dash[diskcache]>=2.14.0",
    "dash-bootstrap-components>=1.5.0",
    "dust_extinction",
    "dustmaps3d",
    "healpy",
    "joblib",
    "kaleido",
    "lightgbm",
    "lightkurve",
    "phoebe; python_version < '3.13'",
    "plotly",
    "pystellibs @ git+https://github.com/mfouesneau/pystellibs.git@v1.0.0",
    "pyvo",
    "regions",
    "requests",
    "scikit-learn",
    "skypatrol",
    "sparclclient",
    "torch",
    "watchdog",
]

[project.scripts]
malca = "malca.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["malca*"]

[tool.setuptools.package-data]
malca = ["review/data/classification_labels/*.json"]
